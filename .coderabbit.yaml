reviews:
  profile: "assertive"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "dev"
  path_instructions:
    - path: "src/lib/**"
      instructions: "Focus on type safety, business logic correctness, and reusability"
    - path: "prisma/**"
      instructions: "Check for migration safety, index coverage, and schema consistency"
    - path: "src/app/api/**"
      instructions: "Verify auth checks, input validation, and error handling"
    - path: "src/components/**"
      instructions: "Check for accessibility, proper component composition, and no nested buttons"
chat:
  auto_reply: true
